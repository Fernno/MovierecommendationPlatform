<h1>Movies</h1>

<form method="GET">
    <input type="text" name="search" placeholder="Search Movie">
    <button type="submit">Search</button>
</form>

{% for movie in movies %}

<h3>{{ movie.title }}</h3>

<img src="{{ movie.poster.url }}" width="200">

<p>{{ movie.description }}</p>

<p>{{ movie.category }}</p>

<a href="{{ movie.trailer_link }}">
    Watch Trailer
</a>

<hr>

{% endfor %}
